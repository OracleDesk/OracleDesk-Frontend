name: Publish Static Build

on:
  workflow_dispatch:
    inputs:
      publish_ipfs:
        description: 'Publish static build to IPFS Pinning Service'
        required: true
        type: boolean
        default: false
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  build-and-verify:
    name: Deterministic Build & Content-Addressed Manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install reviewed install scripts
        run: node scripts/run-allowed-install-scripts.mjs

      - name: Prepare release environment
        run: cp .env.release .env.production.local

      - name: Build static export
        run: npx next build

      - name: Generate Content Manifest & Checksum
        run: node scripts/generate-manifest.mjs out

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: static-export-${{ github.sha }}
          path: out/
          retention-days: 30

  publish-ipfs:
    name: Pin to IPFS & Sign Manifest
    needs: build-and-verify
    if: ${{ github.event.inputs.publish_ipfs == 'true' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: static-export-${{ github.sha }}
          path: out/

      # Keyless signing via Sigstore / Cosign (or documented secret)
      - name: Install Cosign for Keyless Signing
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Sign manifest with OIDC Keyless Attestation
        run: |
          cosign sign-blob \
            --yes \
            --bundle out/manifest.bundle \
            out/manifest.json

      - name: Documented IPFS Deployment Notice
        run: |
          echo "Build signed successfully with Sigstore keyless OIDC."
          echo "To publish to IPFS pinners (e.g. Pinata, Filebase, Web3.storage):"
          echo "Configure IPFS_PINNING_SERVICE_TOKEN in repo secrets."
